# MediaEdge Replication Coordinator Configuration

service = "replication-coordinator"

[server]
host = "0.0.0.0"
port = 8083
request_timeout_secs = 30
max_body_size = 10485760
http2 = true

[auth]
default_mode = "jwt"

[auth.jwt]
algorithm = "HS256"
secret = "${MEDIAEDGE_JWT_SECRET}"
issuer = "mediaedge"
audience = "replication"

[metrics]
enabled = true
path = "/metrics"

[metrics.otlp]
enabled = false
service_name = "mediaedge-replication-coordinator"

[tracing]
enabled = true
level = "info"
format = "json"

# Etcd (required for Raft)
[etcd]
endpoints = ["http://localhost:2379"]
request_timeout_secs = 10
dial_timeout_secs = 10

# NATS
# [nats]
# urls = ["nats://localhost:4222"]

# Replication Planner
[planner]
enabled = true
interval_secs = 30
region_aware = true
demand_triggered = true
capacity_aware = true
anti_affinity = true
min_replicas = 3
max_replicas = 10

# FEC for mesh replication
[fec]
enabled = true
algorithm = "raptorq"
symbol_size = 1400
source_symbols = 100
repair_symbols = 30

# Mesh replication
[mesh]
enabled = true
gossip_interval_ms = 5000
gossip_fanout = 3
replica_timeout_secs = 30