# MediaEdge Edge Node Configuration

service = "edge-node"

[server]
host = "0.0.0.0"
port = 8082
request_timeout_secs = 10
max_body_size = 10485760
http2 = true

[auth]
default_mode = "jwt"

[auth.jwt]
algorithm = "HS256"
secret = "${MEDIAEDGE_JWT_SECRET}"
issuer = "mediaedge"
audience = "edge"

[metrics]
enabled = true
path = "/metrics"

[metrics.otlp]
enabled = false
service_name = "mediaedge-edge-node"

[tracing]
enabled = true
level = "info"
format = "json"

# Local cache storage
[storage]
backend = "fs"
[storage.fs]
root = "/data/edge-cache"
create_if_missing = true
default_bucket = "edge-cache"
root = ""

# Origin (upstream gateway/storage)
[origin]
urls = ["http://gateway:8080"]
health_path = "/health"
timeout_secs = 30
verify_tls = true

# Cache
[cache]
enabled = true
max_size_bytes = 53687091200
max_entries = 1000000
live_ttl_secs = 300
vod_ttl_secs = 86400
stale_while_revalidate_secs = 60
warming_enabled = true
invalidate_on_stream_end = true

# Mesh (WebRTC peer-to-peer)
[mesh]
enabled = false
max_peers = 50
root_peer_count = 3
# signaling_url = "wss://signaling.example.com"

# ICE servers for WebRTC
# [[mesh.ice_servers]]
# urls = ["stun:stun.l.google.com:19302"]
# 
# [[mesh.ice_servers]]
# urls = ["turn:turn.example.com:3478"]
# username = "user"
# credential = "pass"

# Signed URLs
[signed_urls]
enabled = true
algorithm = "hmac-sha256"
hmac_secret = "${MEDIAEDGE_SIGNED_URL_SECRET}"
default_ttl_secs = 3600
allowed_params = ["token", "expires", "signature"]

