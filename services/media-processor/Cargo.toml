[package]
name = "mediaedge-media-processor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "media-processor"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
mediaedge-api = { path = "../../crates/mediaedge-api" }
mediaedge-core = { path = "../../crates/mediaedge-core" }
mediaedge-config = { path = "../../crates/mediaedge-config" }
mediaedge-media = { path = "../../crates/mediaedge-media" }
mediaedge-events = { path = "../../crates/mediaedge-events" }
mediaedge-storage = { path = "../../crates/mediaedge-storage" }
mediaedge-observability = { path = "../../crates/mediaedge-observability" }
mediaedge-auth = { path = "../../crates/mediaedge-auth" }

# HTTP server
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
utoipa-redoc = { workspace = true }
utoipa-rapidoc = { workspace = true }

# TLS
rustls = { workspace = true }
rustls-pemfile = "1.0"
tokio-rustls = "0.26"

# Storage
opendal = { workspace = true }

# Media processing
ffmpeg-next = { workspace = true }
image = { workspace = true }
ravif = { workspace = true }
m3u8-rs = { workspace = true }
dash-mpd = { workspace = true }

# Auth
jsonwebtoken = { workspace = true }

# Async
tokio = { workspace = true }
tokio-stream = "0.1"
futures = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
color-eyre = { workspace = true }
arc-swap = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
figment = { workspace = true }
validator = { workspace = true }

# Job queue
async-nats = { workspace = true }

# Scheduling
cron = "0.10"

# AI (optional)
# ort = { version = "1.16", features = ["cpu"] }  # ONNX Runtime

[dev-dependencies]
testcontainers = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
mockall = { workspace = true }