[package]
name = "mediaedge-gateway"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
mediaedge-api = { path = "../../crates/mediaedge-api" }
mediaedge-core = { path = "../../crates/mediaedge-core" }
mediaedge-config = { path = "../../crates/mediaedge-config" }
mediaedge-observability = { path = "../../crates/mediaedge-observability" }
mediaedge-auth = { path = "../../crates/mediaedge-auth" }
mediaedge-cache = { path = "../../crates/mediaedge-cache" }
mediaedge-media = { path = "../../crates/mediaedge-media" }

# HTTP server
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
utoipa-redoc = { workspace = true }
utoipa-rapidoc = { workspace = true }

# TLS
rustls = { workspace = true }
rustls-pemfile = "1.0"
tokio-rustls = "0.26"

# Auth
jsonwebtoken = { workspace = true }
ring = { workspace = true }

# Async
tokio = { workspace = true }
tokio-stream = "0.1"
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
color-eyre = { workspace = true }
arc-swap = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }

# HTTP client for proxying
reqwest = { workspace = true }

# Rate limiting
governor = { workspace = true }

# Configuration
figment = { workspace = true }
validator = { workspace = true }

# CLI
clap = { workspace = true }

[dev-dependencies]
testcontainers = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
mockall = { workspace = true }