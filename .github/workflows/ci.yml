name: CI

on:
  push:
    branches: [main, test, preview]
  pull_request:
    branches: [test, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTBACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -D warnings

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets --all-features

  unit-test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        run: cargo install cargo-nextest
      - run: cargo nextest run --workspace --profile ci

  integration-test:
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.5.13
        ports: ["2379:2379"]
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
      nats:
        image: nats:2.10-alpine
        ports: ["4222:4222"]
      minio:
        image: bitnami/minio:2024.1.8
        ports: ["9000:9000"]
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        run: cargo install cargo-nextest
      - run: cargo nextest run --workspace --profile integration --test-threads=4
        env:
          MEDIAEDGE_ETCD_ENDPOINTS: http://localhost:2379
          MEDIAEDGE_REDIS_URL: redis://localhost:6379
          MEDIAEDGE_NATS_URL: nats://localhost:4222
          MEDIAEDGE_S3_ENDPOINT: http://localhost:9000

  contract-test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "Pact contract verification placeholder"

  security-audit:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test, integration-test, security-audit]
    if: github.ref == 'refs/heads/test' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx bake --push

  e2e:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/test'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "kind cluster + helm install + e2e suite placeholder"

  benchmark:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-criterion
      - run: cargo criterion --workspace
