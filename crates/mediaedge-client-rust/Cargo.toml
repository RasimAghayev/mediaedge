[package]
name = "mediaedge-client-rust"
version = "0.1.0"
edition = "2021"
description = "Async Rust client for MediaEdge API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RasimAghayev/mediaedge"
documentation = "https://docs.rs/mediaedge-client-rust"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "gzip", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"
tracing = "0.1"
governor = { version = "0.6", features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
mockito = "1"
wiremock = "0.5"