[package]
name = "mediaedge-cli"
version = "0.1.0"
edition = "2021"
description = "MediaEdge CLI tool (mediaedgectl)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RasimAghayev/mediaedge"

[[bin]]
name = "mediaedgectl"
path = "src/main.rs"

[dependencies]
mediaedge-client-rust = { path = "../mediaedge-client-rust" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tabled = "0.16"
indicatif = "0.17"
console = "0.15"
dirs = "5"
toml = "0.8"