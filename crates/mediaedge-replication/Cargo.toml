[package]
name = "mediaedge-replication"
version = "0.1.0"
edition = "2024"

[dependencies]
# Workspace dependencies
tokio = { workspace = true, features = ["full", "tracing"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }

# Replication & Erasure Coding
etcd-client = { workspace = true, features = ["tls"] }
reed-solomon-erasure = { workspace = true }
async-nats = { workspace = true }

# RaptorQ FEC (using a Rust implementation)
# raptorq = { version = "0.2", features = ["tokio"] }

# Config integration
mediaedge-config = { path = "../mediaedge-config" }
mediaedge-observability = { path = "../mediaedge-observability" }

# Dev dependencies
[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "tracing", "test-util"] }

[lib]
path = "src/lib.rs"