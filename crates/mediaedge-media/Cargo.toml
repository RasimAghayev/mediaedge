[package]
name = "mediaedge-media"
version = "0.1.0"
edition = "2024"

[dependencies]
# Workspace dependencies
tokio = { workspace = true, features = ["full", "tracing"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
validator = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
rand = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "gzip"] }
blake3 = { workspace = true }

# Media
ffmpeg-next = { workspace = true }
m3u8-rs = { workspace = true }
dash-mpd = { workspace = true }
mp4 = "0.6"

# Protocol implementations
tokio-util = { version = "0.7", features = ["codec", "io"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"
async-tungstenite = { version = "0.21" }

# RTMP
rtmp = { workspace = true }

# SRT
srt = { workspace = true }

# RIST
# rist = { version = "0.1", features = ["tokio"] }

# WebRTC/WHIP
webrtc = { workspace = true }
str0m = "0.6"

# RTSP
rtsp = { workspace = true }

# MoQ Transport
moq-transport = "0.3"

# Monetization (SSAI)
aws-sdk-mediatailor = "0.3"
aws-sdk-ssm = "1"

# Content Moderation
aws-sdk-rekognition = "0.3"
aws-sdk-s3 = "1"

# Config integration
mediaedge-config = { path = "../mediaedge-config" }
mediaedge-observability = { path = "../mediaedge-observability" }
mediaedge-core = { path = "../mediaedge-core" }

# Dev dependencies
[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "tracing", "test-util"] }
mockall = { workspace = true }
proptest = { workspace = true }

[lib]
path = "src/lib.rs"