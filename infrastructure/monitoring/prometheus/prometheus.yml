global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "mediaedge-gateway"
    static_configs:
      - targets: ["gateway.mediaedge.svc:8080"]
  - job_name: "mediaedge-storage-node"
    static_configs:
      - targets: ["storage-node.mediaedge.svc:8081"]

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
