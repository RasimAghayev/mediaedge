services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.13
    command: etcd -advertise-client-urls=http://0.0.0.0:2379 -listen-client-urls=http://0.0.0.0:2379
    ports: ["2379:2379"]

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]

  nats:
    image: nats:2.10-alpine
    command: -js
    ports: ["4222:4222"]

  minio:
    image: bitnami/minio:2024.1.8
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000"]
    command: server /data --console-address ":9001"

  gateway:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.gateway
    ports: ["8080:8080"]
    environment:
      MEDIAEDGE_ETCD_ENDPOINTS: http://etcd:2379
      MEDIAEDGE_REDIS_URL: redis://redis:6379
      MEDIAEDGE_NATS_URL: nats://nats:4222
      MEDIAEDGE_LOG_LEVEL: debug
    depends_on: [etcd, redis, nats]

  storage-node:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.storage-node
    ports: ["8081:8081"]
    environment:
      MEDIAEDGE_ETCD_ENDPOINTS: http://etcd:2379
      MEDIAEDGE_STORAGE_BACKEND: fs
      MEDIAEDGE_STORAGE_ROOT: /data
    depends_on: [etcd]
