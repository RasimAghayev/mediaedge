apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mediaedge
resources:
  - ../../base
namePrefix: prod-
images:
  - name: ghcr.io/RasimAghayev/mediaedge-gateway
    newTag: prod
  - name: ghcr.io/RasimAghayev/mediaedge-storage-node
    newTag: prod
replicas:
  - name: gateway
    count: 5
  - name: storage-node
    count: 5
