apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: mediaedge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-js", "-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: mediaedge
spec:
  selector:
    app: nats
  ports:
    - port: 4222
    - port: 8222
  type: ClusterIP
