apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: mediaedge
spec:
  serviceName: etcd
  replicas: 3
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: gcr.io/etcd-development/etcd:v3.5.13
          command:
            - etcd
            - -advertise-client-urls=http://0.0.0.0:2379
            - -listen-client-urls=http://0.0.0.0:2379
            - -advertise-peer-urls=http://0.0.0.0:2380
            - -listen-peer-urls=http://0.0.0.0:2380
            - -initial-cluster=etcd-0.etcd.mediaedge.svc:2380,etcd-1.etcd.mediaedge.svc:2380,etcd-2.etcd.mediaedge.svc:2380
            - -initial-cluster-state=new
          ports:
            - containerPort: 2379
            - containerPort: 2380
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: mediaedge
spec:
  selector:
    app: etcd
  clusterIP: None
  ports:
    - port: 2379
      name: client
    - port: 2380
      name: peer
