{{- if .Values.ingress.enabled -}}
{{- $serviceName := include "mediaedge.fullname" . }}
{{- $servicePort := .Values.service.port }}
{{- $ingressClass := .Values.ingress.className }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mediaedge.fullname" . }}
  labels:
    {{- include "mediaedge.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $ingressClass }}
  ingressClassName: {{ $ingressClass }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Values.ingress.hosts[0].backend.service.name | default $serviceName }}
                port:
                  number: {{ $.Values.ingress.hosts[0].backend.service.port.number | default $servicePort }}
          {{- end }}
    {{- end }}
{{- end }}
