# Default values for MediaEdge
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: ghcr.io/RasimAghayev/mediaedge
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mediaedge.local
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: gateway
              port:
                number: 80
  tls: []

resources: {}
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

etcd:
  enabled: true
  replicas: 3

redis:
  enabled: true

nats:
  enabled: true

observability:
  prometheus:
    enabled: true
  loki:
    enabled: true
  jaeger:
    enabled: true
  grafana:
    enabled: true
